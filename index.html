<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bouquet For Thảo My</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Courier Prime', monospace;
        }

        #experience-container {
            position: relative; width: 100vw; height: 100vh; z-index: 10;
        }

        /* PHONG THƯ */
        #envelope-wrapper {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 50; cursor: pointer;
        }
        .env-text { font-size: 22px; color: #5d4037; margin: 15px 0; font-weight: bold; }
        .hint { font-size: 12px; letter-spacing: 2px; opacity: 0.6; margin-top: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .envelope-body {
            width: 300px; height: 200px; background: #f4c0b9;
            position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border-radius: 4px;
        }
        .envelope-flap {
            position: absolute; top: 0; left: 0;
            border-left: 150px solid transparent; border-right: 150px solid transparent;
            border-top: 110px solid #e2b6b0; transform-origin: top; z-index: 4;
        }
        .envelope-bottom {
            position: absolute; bottom: 0; left: 0;
            border-left: 150px solid transparent; border-right: 150px solid transparent;
            border-bottom: 110px solid #eeb4ac; z-index: 3;
        }

        /* VẬT THỂ BAY RA */
        #scattered-items { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .drag-item {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0; cursor: grab; pointer-events: auto;
            filter: drop-shadow(5px 15px 15px rgba(0,0,0,0.2)); 
        }
        .drag-item:active { cursor: grabbing; filter: drop-shadow(10px 25px 20px rgba(0,0,0,0.3)); }

        .letter-card {
            background: #fffdf5; width: 300px; padding: 30px; border-radius: 8px;
            font-family: 'Caveat', cursive; font-size: 26px; color: #4a4a4a; line-height: 1.4;
        }

        /* ẢNH POLAROID CÓ LỚP CÀO (SCRATCH) */
        .polaroid-scratch {
            background: white; padding: 12px 12px 45px 12px; border-radius: 4px;
            width: 220px; position: relative;
        }
        .scratch-image-container {
            position: relative; width: 196px; height: 240px;
        }
        .scratch-image-container img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 2px;
            pointer-events: none; /* Tránh cản trở sự kiện chuột */
        }
        /* Lớp bạc phủ lên trên */
        canvas.scratch-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 2;
            cursor: crosshair; /* Trỏ chuột hình chữ thập khi cào */
        }
        
        .polaroid-text {
            position: absolute; bottom: 12px; left: 0; width: 100%;
            text-align: center; font-family: 'Caveat', cursive; font-size: 20px; color: #555;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="experience-container">
        
        <div id="envelope-wrapper">
            <div class="env-text">FROM: UIS Media</div>
            <div class="envelope-body">
                <div class="envelope-flap" id="env-flap"></div>
                <div class="envelope-bottom"></div>
            </div>
            <div class="env-text">TO: Thảo My</div>
            <div class="hint">CLICK ĐỂ MỞ THƯ</div>
        </div>

        <div id="scattered-items">
            
            <div class="drag-item letter-card" id="item-letter">
                Gửi Chủ nhiệm xịn xò,<br><br>
                Hãy cào bức ảnh bên cạnh để xem kỷ niệm nhé. Đừng quên phương châm:<br><br>
                <strong>"Sống hết mình cho ngày hôm nay!"</strong> 📸✨
            </div>

            <!-- ẢNH POLAROID CÀO (SCRATCH) -->
            <div class="drag-item polaroid-scratch" id="item-scratch">
                <div class="scratch-image-container">
                    <!-- Ảnh bị giấu bên dưới -->
                    <img src="https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80&w=400&auto=format&fit=crop" alt="Memory">
                    <!-- Lớp Canvas để cào -->
                    <canvas id="scratch-pad" class="scratch-layer"></canvas>
                </div>
                <div class="polaroid-text">Nắm viền trắng để kéo ↔️</div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    
    <script>
        gsap.registerPlugin(Draggable);
        let highestZIndex = 100;

        // --- HỆ THỐNG CÀO ẢNH (CANVAS SCRATCH) ---
        const canvas = document.getElementById('scratch-pad');
        const ctx = canvas.getContext('2d');
        
        // Cài đặt kích thước thực của canvas khớp với CSS
        canvas.width = 196;
        canvas.height = 240;

        // Phủ màu xám bạc lên toàn bộ canvas
        ctx.fillStyle = '#b0bec5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Ghi chữ "Scratch me" lên lớp phủ
        ctx.font = '24px Caveat';
        ctx.fillStyle = '#455a64';
        ctx.textAlign = 'center';
        ctx.fillText('Scratch me!', canvas.width / 2, canvas.height / 2);

        let isDrawing = false;

        // Hàm xử lý việc xóa lớp phủ (như cục tẩy)
        function scratch(e) {
            if (!isDrawing) return;
            
            // Lấy tọa độ chuột/chạm chính xác trên canvas
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // 'destination-out' làm cho nét vẽ tiếp theo sẽ xóa đi màu cũ thay vì đè lên
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2); // Bán kính nét cào là 18px
            ctx.fill();
        }

        // Bắt sự kiện chuột và cảm ứng trên Canvas
        // StopPropagation rất quan trọng: Nó ngăn không cho sự kiện click lọt xuống thư viện GSAP Draggable
        const startScratch = (e) => { isDrawing = true; e.stopPropagation(); };
        const stopScratch = () => { isDrawing = false; };
        const doScratch = (e) => { e.stopPropagation(); scratch(e); };

        canvas.addEventListener('mousedown', startScratch);
        canvas.addEventListener('mousemove', doScratch);
        canvas.addEventListener('mouseup', stopScratch);
        canvas.addEventListener('mouseleave', stopScratch);

        canvas.addEventListener('touchstart', startScratch, {passive: true});
        canvas.addEventListener('touchmove', doScratch, {passive: true});
        canvas.addEventListener('touchend', stopScratch);


        // --- TIMELINE MỞ THƯ & KÉO THẢ ---
        const envelope = document.getElementById('envelope-wrapper');
        const flap = document.getElementById('env-flap');
        const items = document.querySelectorAll('.drag-item');

        const scatterData = [
            { x: -200, y: -20, rot: -8 },   // Thiệp
            { x: 220, y: 10, rot: 5 },      // Ảnh cào
        ];

        envelope.addEventListener('click', () => {
            const tl = gsap.timeline();

            tl.to(flap, { rotationX: 180, duration: 0.5, ease: "power2.inOut" })
              .to(envelope, { y: "+=50", opacity: 0, duration: 0.6, ease: "power2.in", onComplete: () => envelope.style.display = 'none' }, "+=0.2");

            items.forEach((item, index) => {
                let data = scatterData[index];
                item.style.zIndex = highestZIndex + index;
                
                tl.to(item, {
                    x: data.x, y: data.y, rotation: data.rot,
                    scale: 1, opacity: 1, duration: 1.2, ease: "back.out(1.5)"
                }, "-=0.4"); 
            });

            // Khởi tạo kéo thả
            Draggable.create(".drag-item", {
                type: "x,y",
                edgeResistance: 0.7,
                bounds: "#experience-container",
                onPress: function() {
                    highestZIndex++;
                    this.target.style.zIndex = highestZIndex;
                    gsap.to(this.target, { scale: 1.02, duration: 0.2 });
                },
                onRelease: function() {
                    gsap.to(this.target, { scale: 1, duration: 0.2 });
                }
            });
        }, { once: true });
    </script>
</body>
</html>
