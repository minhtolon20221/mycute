<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bouquet For You</title>
    <!-- Font chữ viết tay cho thiệp -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        /* RESET & CẤU TRÚC CHUNG */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            font-family: 'Courier Prime', monospace;
        }
        /* Phủ một lớp màu hồng nhẹ lên hình nền cho đúng vibe */
        body::before {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 234, 236, 0.85);
            z-index: 1;
        }

        #experience-container {
            position: relative;
            width: 100vw; height: 100vh;
            z-index: 10;
        }

        /* TẠO HÌNH PHONG THƯ BẰNG PURE CSS */
        #envelope-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #envelope-wrapper:hover { transform: translate(-50%, -50%) scale(1.05); }
        
        .env-text { font-size: 20px; color: #5d4037; margin: 15px 0; font-weight: bold; }
        .hint { font-size: 12px; letter-spacing: 2px; opacity: 0.6; margin-top: 10px; }
        
        .envelope-body {
            width: 280px; height: 180px;
            background: #f4d0cb;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        /* Nắp phong thư */
        .envelope-body::before {
            content: ''; position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #e2b6b0;
            z-index: 3;
        }
        /* Nếp gấp dưới */
        .envelope-body::after {
            content: ''; position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: 140px solid #f4c0b9;
            border-right: 140px solid #f4c0b9;
            border-bottom: 90px solid #eeb4ac;
            z-index: 2;
        }

        /* STYLE CHO CÁC VẬT THỂ (Ẩn lúc đầu) */
        #scattered-items {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .drag-item {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            box-shadow: 2px 10px 25px rgba(0,0,0,0.15);
            cursor: grab;
            pointer-events: auto;
        }
        .drag-item:active { cursor: grabbing; box-shadow: 5px 15px 35px rgba(0,0,0,0.25); }

        /* Style ảnh Polaroid */
        .polaroid {
            background: white;
            padding: 12px 12px 45px 12px;
            border-radius: 3px;
        }
        .polaroid img { width: 180px; height: 220px; object-fit: cover; }
        .polaroid-text {
            position: absolute; bottom: 12px; left: 0; width: 100%;
            text-align: center; font-family: 'Caveat', cursive; font-size: 22px; color: #333;
        }

        /* Style Tấm thiệp */
        .letter-card {
            background: #fffdf5;
            width: 260px; height: 320px;
            padding: 25px;
            border-radius: 8px;
            font-family: 'Caveat', cursive;
            font-size: 24px; color: #4a4a4a;
            line-height: 1.4;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02), 2px 10px 25px rgba(0,0,0,0.15);
        }

        /* Khối Widget (Map / Iframe) */
        .widget { background: white; padding: 10px; border-radius: 12px; }
        .widget-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; color: #777;}

    </style>
</head>
<body>

    <div id="experience-container">
        
        <!-- PHONG THƯ Ở GIỮA MÀN HÌNH -->
        <div id="envelope-wrapper">
            <div class="env-text">FROM Hội Xí Xọn</div>
            <div class="envelope-body"></div>
            <div class="env-text">FOR Thảo My</div>
            <div class="hint">CLICK THE ENVELOPE</div>
        </div>

        <!-- CÁC ĐỒ VẬT SẼ VĂNG RA SAU KHI CLICK -->
        <div id="scattered-items">
            
            <!-- Tấm thiệp gửi gắm thông điệp -->
            <div class="drag-item letter-card" id="item-letter">
                Gửi cô Chủ nhiệm CLB Truyền thông,<br><br>
                Mong cậu luôn giữ được ngọn lửa đam mê với những dòng code và sự sáng tạo không giới hạn.<br><br>
                Hãy nhớ nhé: <strong>"Sống hết mình cho ngày hôm nay!"</strong> 🌸
            </div>

            <!-- Ảnh Polaroid 1: Mèo -->
            <div class="drag-item polaroid" id="item-cat">
                <!-- Dùng link ảnh Unsplash ngẫu nhiên về mèo -->
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=400&auto=format&fit=crop" alt="Cat">
                <div class="polaroid-text">Meow meow~</div>
            </div>

            <!-- Ảnh Polaroid 2: Du lịch -->
            <div class="drag-item polaroid" id="item-travel">
                <!-- Dùng link ảnh Unsplash về du lịch -->
                <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?q=80&w=400&auto=format&fit=crop" alt="Travel">
                <div class="polaroid-text">Let's travel the world!</div>
            </div>

            <!-- YouTube Iframe: Tượng trưng cho nhạc Soobin Hoàng Sơn -->
            <div class="drag-item widget" id="item-music">
                <div class="widget-title">🎵 Playlist Vibes</div>
                <iframe width="280" height="150" src="https://www.youtube.com/embed/5F2_N_VpL6I?si=j2N1_c4MhH1x8pPz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Google Maps -->
            <div class="drag-item widget" id="item-map">
                <div class="widget-title">📍 Memory Map</div>
                <iframe src="https://www.google.com/maps?q=Trường+THPT+Hạ+Hòa&output=embed" width="280" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            
        </div>
    </div>

    <!-- THƯ VIỆN GSAP ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    
    <script>
        gsap.registerPlugin(Draggable);
        let highestZIndex = 100;

        const envelope = document.getElementById('envelope-wrapper');
        const items = document.querySelectorAll('.drag-item');

        // Setup tọa độ và góc xoay cố định cho từng item để lúc văng ra nhìn đẹp nhất, không bị đè lên nhau
        const scatterData = [
            { x: -250, y: -80, rot: -10 },   // Thiệp (bên trái)
            { x: 280, y: -150, rot: 15 },    // Ảnh Mèo (góc trên phải)
            { x: -300, y: 200, rot: -12 },   // Ảnh Du lịch (góc dưới trái)
            { x: 0, y: -220, rot: 5 },       // Nhạc (ở trên cùng giữa)
            { x: 300, y: 150, rot: 8 }       // Map (góc dưới phải)
        ];

        // Xử lý sự kiện Click phong thư
        envelope.addEventListener('click', () => {
            
            // 1. Zoom out và làm mờ phong thư
            gsap.to(envelope, {
                scale: 0, opacity: 0, duration: 0.6, ease: "back.in(1.5)",
                onComplete: () => envelope.style.display = 'none'
            });

            // 2. Bắn các item ra xung quanh
            items.forEach((item, index) => {
                let data = scatterData[index];
                
                // Set z-index mặc định ban đầu
                item.style.zIndex = highestZIndex + index;

                gsap.to(item, {
                    x: data.x,
                    y: data.y,
                    rotation: data.rot,
                    scale: 1,
                    opacity: 1,
                    duration: 1.2,
                    delay: 0.3 + (index * 0.1), // Delay nối tiếp nhau
                    ease: "elastic.out(1, 0.75)" // Hiệu ứng nảy nhẹ nhàng
                });
            });

            // 3. Khởi tạo tính năng kéo thả
            Draggable.create(".drag-item", {
                type: "x,y",
                edgeResistance: 0.8,
                bounds: "#experience-container", // Khóa trong màn hình
                onPress: function() {
                    // Khi click vào vật nào, đẩy nó lên layer trên cùng
                    highestZIndex++;
                    this.target.style.zIndex = highestZIndex;
                    gsap.to(this.target, { scale: 1.05, duration: 0.2 });
                },
                onRelease: function() {
                    gsap.to(this.target, { scale: 1, duration: 0.2 });
                }
            });
        });
    </script>
</body>
</html>
